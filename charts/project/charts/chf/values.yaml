#
# Software Name : helm
#
nameOverride: ""
fullnameOverride: ""

global:
  projectName: chf
  nrf:
    service:
      name: service-enterprise1-slice1-nfmanagement.ns-enterprise1.svc.cluster.local
      type: ClusterIP
      port: "8080"
      mutalTls: false
  webui: 
    service:
      name: webui-nbiling
      type: ClusterIP
      port: "2122"
  cgf:
    service:
      name: webui-ncgf
      type: ClusterIP
      port: "2121"
  sbi:
    scheme: http
    mutalTls: false

# This section can be used to override the default values in the MongoDB chart (remember MongoDB is a subchart of the chart since control plane NFs rely on it.
mongodb:
  service:
    name: mongodb
    type: ClusterIP
    port: 27017

chf:
  name: chf
  replicaCount: 1
  image:
    name: myregistrydomain.com:5000/chf-nsf
    tag: 12
    pullPolicy: Always
  # environment: 
  #   - name: CDR_DIR
  #     value: /data/cdr/incoming
  service:
    type: ClusterIP
    port: 8080
  configmap:
    name: chf-configmap
  volume:
    mount: /chf/config/
    tlsmount: /chf/config/TLS
    certmount: /chf/nrf-cert
    # cdrmount: /data/cdr/
  podAnnotations: {}
    # additional annotations
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold:  40
    successThreshold: 1
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: false
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths: []
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  configuration: 
    serviceNameList: |-
      - nchf-convergedcharging # Nchf_AMPolicyControl service
    
    # Metrics configuration
    metrics:
      enable: false # (Optional, default false)
      scheme: http # (Required) the protocol for metrics (http or https, default https)
      port: 9091 # (Optional, default 9091) port used to bind the service
      namespace: ns-chf

    logger: # log output setting
      enable: true # true or false
      level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
      reportCaller: false # enable the caller report or not, value: true or false

    plmnSupportList: # the PLMNs (Public land mobile network) list supported by this AMF
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: "608" # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: "01" # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: "19CDE1" # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd:  # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: "608" # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: "01" # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: "010203" # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: "112233" # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
initcontainers:
  busybox:
    image: busybox
    tag: "1.32.0"


cdr:
  enabled: true
  basePath: /data/cdr
  writerDir: /data/cdr/incoming

  pvc:
    create: true
    name: ""                   # auto-name via helper
    storageClassName: nfs-client   # CHANGE to your RWX class
    size: 20Gi
    accessModes:
      - ReadWriteMany

  uploader:
    enabled: true
    schedule: "*/5 * * * *"
    minSizeBytes: "5242880"      # 5 MB
    minAgeSeconds: "0"         # 5 minutes
    quietSeconds: "30"           # 30 seconds
    image:
      repository: "myregistrydomain.com:5000/chf-nsf-uploader"
      tag: "1"
      pullPolicy: IfNotPresent
    sftp:
      host: 10.0.20.42  
      port: 8654
      remoteDir: /incoming/cdr
      username: test 
      auth:
      #   username: test        
      # #   password:    
      # # knownHosts: |-
      # #  
        privatekey: ""