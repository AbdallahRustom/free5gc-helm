#

#
{{- with .Values.chf }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-{{ .name }}
  labels:
    {{- include "chf.labels" $ | nindent 4 }}
    project: {{ $.Values.global.projectName }}
    nf: {{ .name }}
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chf.selectorLabels" $ | nindent 6 }}
      project: {{ $.Values.global.projectName }}
      nf: {{ .name }}
  template:
    metadata:
      annotations:
        {{- include "chf.chfAnnotations" $ | nindent 8 }}
        {{- if $.Values.chf.configuration.metrics.enable }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ $.Values.chf.configuration.metrics.port | quote }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/chf-configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "chf.selectorLabels" $ | nindent 8 }}
        project: {{ $.Values.global.projectName }}
        nf: {{ .name }}
    spec:
      imagePullSecrets:
        {{- toYaml .imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      initContainers:
      - name: wait-mongo
        {{- with $.Values.initcontainers.busybox }}
        image: {{ .image }}:{{ .tag }}
        {{- end }}
        env:
        - name: DEPENDENCIES
          {{- with $.Values.mongodb.service }}
          value: {{ .name }}:{{ .port }}
          {{- end }}
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the MongoDB; sleep 2; done;"]
      containers:
      - name: {{ .name }}
        image: {{ .image.name }}:{{ .image.tag | default $.Chart.AppVersion }}
        imagePullPolicy: {{ .image.pullPolicy }}
        securityContext:
          {{- toYaml .securityContext | nindent 12 }}
        ports:
        - name: nchf
          containerPort: {{ .service.port }}
        {{- if $.Values.chf.configuration.metrics.enable }}
        - name: metrics
          containerPort: {{ $.Values.chf.configuration.metrics.port }}
        {{- end }}
        command: ["./chf"]
        args: ["-c", "./config/chfcfg.yaml"]
        # command: ["sleep"]
        # args: ["100000"]
        env:
          - name: GIN_MODE
            value: release
        volumeMounts:
          - mountPath: {{ .volume.mount }}
            name: {{ include "chf.fullname" $ }}-volume
          - mountPath: {{ .volume.tlsmount }}
            name: {{ include "chf.fullname" $ }}-empty-volume
        #   - mountPath: {{ .volume.certmount }}
        #     name: {{ include "chf.fullname" $ }}-cert-pvc
        resources:
          {{- toYaml .resources | nindent 12 }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .affinity | nindent 8 }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}

      volumes:
        - name: {{ include "chf.fullname" $ }}-volume
          projected:
            sources:
            - configMap:
                name: {{ include "chf.fullname" $ }}-configmap
        - name: {{ include "chf.fullname" $ }}-empty-volume
          emptyDir: {}
        # - name: {{ include "chf.fullname" $ }}-cert-pvc
        #   persistentVolumeClaim:
        #     claimName: cert-pvc
{{- end }}
