{{- if and .Values.cdr.enabled .Values.cdr.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "chf.fullname" . }}-cdr-cleanup
spec:
  schedule: "{{ .Values.cdr.cleanup.schedule }}"
  {{- with .Values.cdr.cleanup.timeZone }}
  timeZone: "{{ . }}"
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: "{{ .Values.cdr.cleanup.image.repository }}:{{ .Values.cdr.cleanup.image.tag }}"
              imagePullPolicy: {{ .Values.cdr.cleanup.image.pullPolicy }}
              command: ["/bin/sh", "-lc"]
              args: ["/scripts/cleanup.sh"]
              env:
                - name: TARGET_DIR
                  value: "{{ .Values.cdr.cleanup.sentDir }}"
                - name: ONLY_OLDER_THAN_DAYS
                  value: "{{ .Values.cdr.cleanup.onlyOlderThanDays }}"
              volumeMounts:
                - name: cleanup-script
                  mountPath: /scripts
                  readOnly: true
                - name: cdr-data
                  mountPath: "{{ .Values.cdr.basePath }}"
          volumes:
            - name: cleanup-script
              configMap:
                name: {{ include "chf.fullname" . }}-cdr-cleanup
                defaultMode: 0555
            - name: cdr-data
              persistentVolumeClaim:
                claimName: {{ include "chf.cdr.pvcName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
