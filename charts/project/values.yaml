#
# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: project
  nrf:
    service:
      name: service-enterprise1-slice1-nfmanagement.ns-enterprise1.svc.cluster.local
      type: ClusterIP
      port: "8080"
  sbi:
    scheme: http


# These parameters can be used to enable/disable deployment of subcharts
deployMongoDb: false
deployChf: true
deployWebui: false


# This section can be used to override the default values in the MongoDB chart
mongodb:
  fullnameOverride: "mongodb"
  useStatefulSet: true
  auth:
    enabled: false
  persistence:
    enabled: false
  #   storageClass: "standard"
  #   size: 6Gi
  #   mountPath: /bitnami/mongodb/data/db/
  service:
    name: mongodb
    type: ClusterIP
    port: 27017
    nodePort: "30017"
